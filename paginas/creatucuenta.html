    <main class="pt-5 min-vh-100">
        <div class="d-flex justify-content-center align-items-center min-vh-100 py-4 mt-5">
            <form class="card p-4 shadow-color w-75 w-md-50 w-lg-25 form-container-limite">
                <h3 class="text-center mb-4">CREA TU CUENTA</h3>
                <div class="row mb-3 g-3">
                    <div class="col-12 col-md-6">
                        <label for="Nombre" class="form-label text-white fw-bold">Nombre</label>
                        <input type="text" class="form-control w-100 formlogin" placeholder="Ej: Juan"
                            aria-label="Nombre" minlength="3" maxlength="25" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="Apellido" class="form-label text-white fw-bold">Apellido</label>
                        <input type="text" class="form-control  w-100 formlogin" placeholder="Ej: Ruiz"
                            aria-label="Apellido" minlength="3" maxlength="25" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="Email" class="form-label text-white fw-bold">Email</label>
                    <input type="email" class="form-control w-100 formlogin" placeholder="Ej: novastream@gmail.com"
                        minlength="5" maxlength="30" required>
                </div>

                <div class="mb-3">
                    <label for="Contraseña" class="form-label text-white fw-bold">Contraseña</label>
                    <input type="password" class="form-control w-100 formlogin" placeholder="XXXXXXXXXXXXXXX"
                        minlength="5" maxlength="25" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 text-crearcuenta">Crear cuenta</button>
        </div>
        </form>
