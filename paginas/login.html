                <div class="mb-3">

                    <input type="email" class="form-control w-100 formlogin" placeholder="Ej: novastream@gmail.com" minlength="8"
                        maxlength="40" required>
                </div>

                    <label for="Contraseña" class="form-label text-white fw-bold">Contraseña</label>
                    <input type="password" class="form-control w-100 formlogin" placeholder="XXXXXXXXXXXXXXX" minlength="8"

                </div>
                <div class="d-flex justify-content-between align-items-center mt-3 ms-1 mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="checkIndeterminate">
