                <h3 class="text-center mb-4">Crear tu cuenta</h3>
                <div class="row mb-3 g-3">
                    <div class="col-12 col-md-6">
                        <input type="text" class="form-control w-100" placeholder="Nombre" aria-label="Nombre" minlength="5" maxlength="20" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <input type="text" class="form-control w-100" placeholder="Apellido" aria-label="Apellido" minlength="5" maxlength="20" required>
                    </div>
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control w-100" placeholder="@Email" minlength="8" maxlength="20" required>
                </div>

                <div class="mb-3">
                    <input type="password" class="form-control w-100" placeholder="Contraseña" minlength="8" maxlength="20" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 text-center">Crear cuenta</button>
            </div>
        </form>
